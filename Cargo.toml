[package]
name = "lpr"
version = "1.4.0"
edition = "2021"
authors = ["Sunil Warrier"]
license = "MIT OR Unlicense"
description = "Modern Multi-Threaded Rust SQL Log Parser, Fleet Scanner & Security Auditor — Made using vibe coding by Sunil Warrier"

[dependencies]
tokio = { version = "1.40", features = ["full"] }
datafusion = "42.0"
arrow = { version = "53.0", features = ["prettyprint"] }
parquet = { version = "53.0", features = ["arrow", "async"] }
clap = { version = "4.5", features = ["derive", "env"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
csv = "1.3"
anyhow = "1.0"
regex = "1.11"
flate2 = "1.0"
zstd = "0.13"
zip = { version = "=2.4.2", default-features = false, features = ["deflate"] }
rayon = "1.10"
evtx = "0.8"
calamine = "0.26"
glob = "0.3"
urlencoding = "2.1"
ipnet = "2.10"
chrono = { version = "0.4", features = ["serde"] }
axum = "0.7"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
ratatui = "0.28"
crossterm = "0.28"

tao = { version = "0.30", optional = true }
wry = { version = "0.44", optional = true }

[features]
default = []
gui = ["dep:tao", "dep:wry"]

[profile.dev]
opt-level = 1
debug = 0
incremental = true

[profile.dev.package."*"]
opt-level = 2
debug = false

[profile.release]
opt-level = 2
lto = false
incremental = true
codegen-units = 64
panic = "abort"
strip = "none"

[profile.dist]
inherits = "release"
opt-level = 3
lto = "thin"
incremental = false
codegen-units = 16
strip = "symbols"

